; PLACEHOLDER -- replace this file with a real profile before printing.
;
; How to get one:
;   1. Open PrusaSlicer, set up your printer, nozzle, and filament correctly
;      (this is exactly what you'd do before slicing anything by hand).
;   2. File -> Export -> Export Config Bundle (or right-click a profile ->
;      Export), save it as an .ini file.
;   3. Put it here (or anywhere) and point PRINTER_PROFILE at it in your .env.
;
; Slicing will fail with a clear error until you do this -- it's deliberately
; not guessing at your printer's bed size, nozzle diameter, or filament type.
