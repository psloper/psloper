<!DOCTYPE html><html><head><meta charset="utf-8"><title>Named type lineup</title>
<script type="importmap">{ "imports": { "three": "../../js/vendor/three.module.js" } }</script>
<style>body{margin:0;background:#f2f4f7}canvas{display:block}</style></head><body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { aircraftGeometry } from '../js/scene.js';
import { TARGET_PRESETS, TARGET_GROUPS } from '../js/model.js';

// Every named type, plan view, drawn to the SAME SCALE so the size differences
// between an A350 and a Cessna are the real ones.
const KEYS = Object.entries(TARGET_PRESETS)
  .filter(([, v]) => TARGET_GROUPS.indexOf(v.group) >= 1 && TARGET_GROUPS.indexOf(v.group) <= 7)
  .map(([k]) => k);
const COLS = 4, CELL = 360;
const rows = Math.ceil(KEYS.length / COLS);
const W = COLS * CELL, H = rows * CELL;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(W, H); renderer.setClearColor(0xf2f4f7, 1);
renderer.setScissorTest(true);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa5b1, 2.0));
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(1.5, 3, 2); scene.add(sun);
const mat = new THREE.MeshStandardMaterial({ color: 0x2b3440, roughness: 0.55, metalness: 0.05 });
const holder = new THREE.Group(); scene.add(holder);
const R = 38;                                   // metres half-height of a cell
KEYS.forEach((key, i) => {
  const p = TARGET_PRESETS[key];
  const g = aircraftGeometry(p.spanM, p.lengthM, { planform: p.planform, wing: p.wing,
    engines: p.engines, enginesOn: p.enginesOn });
  g.traverse((m) => { if (m.isMesh) m.material = mat; });
  holder.clear(); holder.add(g);
  const col = i % COLS, row = Math.floor(i / COLS);
  const x = col * CELL, y = H - (row + 1) * CELL;
  const cam = new THREE.OrthographicCamera(-R, R, R, -R, 0.1, 500);
  cam.position.set(0, 100, 0); cam.up.set(0, 0, -1); cam.lookAt(0, 0, 0);
  renderer.setViewport(x, y, CELL, CELL); renderer.setScissor(x, y, CELL, CELL);
  renderer.render(scene, cam);
});
window.__labels = KEYS.map((k) => TARGET_PRESETS[k].label);
window.__drawn = true;
</script></body></html>
