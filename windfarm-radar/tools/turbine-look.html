<!DOCTYPE html><html><head><meta charset="utf-8"><title>Turbine three-view</title>
<script type="importmap">{ "imports": { "three": "../../js/vendor/three.module.js" } }</script>
<style>body{margin:0;background:#eef1f5}canvas{display:block}</style></head><body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { turbineGeometry } from '../js/scene.js';
import { TURBINE_PRESETS } from '../js/model.js';

// One machine, three orthographic views at a KNOWN scale over a metre grid,
// built with the SAME function the scene uses so the harness and the screen
// cannot drift apart. Girth 1 throughout: this is the true machine.
const key = new URL(location).searchParams.get('t') || 'mid-2300';
const p = { ...TURBINE_PRESETS[key] };
p.rotorRadiusM = p.rotorDiameterM / 2;
p.yawDeg = 180;                                  // rotor faces +z, towards the front view
const W = 1400, VIEW = 700, H = VIEW * 2;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(W, H); renderer.setClearColor(0xeef1f5, 1);
renderer.setScissorTest(true);

const tall = p.hubHeightM + p.rotorDiameterM / 2;
const scale = Math.min((W - 60) / (p.rotorDiameterM * 1.1), (VIEW - 40) / (tall * 1.05));
const grid = 20;

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x97a2ae, 2.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(1.4, 2.0, 2.2); scene.add(sun);

const ext = Math.max(p.rotorDiameterM, tall) * 0.8;
const pts = [], pts5 = [];
for (let v = -Math.ceil(ext / grid) * grid; v <= ext; v += grid) {
  const t = Math.abs(v % (grid * 5)) < 1e-6 ? pts5 : pts;
  t.push(new THREE.Vector3(v, -ext, 0), new THREE.Vector3(v, ext, 0));
  t.push(new THREE.Vector3(-ext, v, 0), new THREE.Vector3(ext, v, 0));
  t.push(new THREE.Vector3(v, 0, -ext), new THREE.Vector3(v, 0, ext));
  t.push(new THREE.Vector3(-ext, 0, v), new THREE.Vector3(ext, 0, v));
  t.push(new THREE.Vector3(0, v, -ext), new THREE.Vector3(0, v, ext));
  t.push(new THREE.Vector3(0, -ext, v), new THREE.Vector3(0, ext, v));
}
const mk = (a, c) => new THREE.LineSegments(
  new THREE.BufferGeometry().setFromPoints(a), new THREE.LineBasicMaterial({ color: c }));
scene.add(mk(pts, 0xc7d0da)); scene.add(mk(pts5, 0x9aa7b4));
// The ground, so a tower that floats or sinks is obvious.
scene.add(mk([new THREE.Vector3(-ext, 0, 0), new THREE.Vector3(ext, 0, 0),
  new THREE.Vector3(0, 0, -ext), new THREE.Vector3(0, 0, ext)], 0x33414d));

const g = turbineGeometry(p, { girth: 1 });
const mat = new THREE.MeshStandardMaterial({ color: 0x3a4653, roughness: 0.5, metalness: 0.08 });
g.traverse((m) => { if (m.isMesh) m.material = mat; });
scene.add(g);
g.updateMatrixWorld(true);

const mid = tall / 2;
const views = [
  { pos: [0, mid, 600], up: [0, 1, 0], y: VIEW },   // front, looking at the rotor
  { pos: [600, mid, 0], up: [0, 1, 0], y: 0 },      // side
];
for (const v of views) {
  const cam = new THREE.OrthographicCamera(
    -W / (2 * scale), W / (2 * scale), VIEW / (2 * scale), -VIEW / (2 * scale), 0.1, 3000);
  cam.position.set(...v.pos); cam.up.set(...v.up); cam.lookAt(0, mid, 0);
  renderer.setViewport(0, v.y, W, VIEW); renderer.setScissor(0, v.y, W, VIEW);
  renderer.render(scene, cam);
}

const parts = {};
const bb = new THREE.Box3();
g.traverse((m) => {
  if (!m.isMesh) return;
  const n = m.userData.part || 'unnamed';
  bb.setFromObject(m);
  const e = parts[n] || (parts[n] = { minX: Infinity, maxX: -Infinity, minY: Infinity,
    maxY: -Infinity, minZ: Infinity, maxZ: -Infinity, n: 0 });
  e.minX = Math.min(e.minX, bb.min.x); e.maxX = Math.max(e.maxX, bb.max.x);
  e.minY = Math.min(e.minY, bb.min.y); e.maxY = Math.max(e.maxY, bb.max.y);
  e.minZ = Math.min(e.minZ, bb.min.z); e.maxZ = Math.max(e.maxZ, bb.max.z);
  e.n += 1;
});
window.__parts = parts;
window.__meta = { key, label: p.label, hub: p.hubHeightM, rotor: p.rotorDiameterM,
  chord: p.bladeChordM, blades: p.bladeCount, grid, scale };
window.__drawn = true;
</script></body></html>
