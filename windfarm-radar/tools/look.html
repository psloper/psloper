<!DOCTYPE html><html><head><meta charset="utf-8"><title>Aircraft look</title>
<script type="importmap">{ "imports": { "three": "../../js/vendor/three.module.js" } }</script>
<style>body{margin:0;background:#f2f4f7}canvas{display:block}</style></head><body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { aircraftGeometry } from '../js/scene.js';
import { TARGET_PRESETS } from '../js/model.js';

// One class, three orthographic views, drawn large enough to judge the shape
// rather than to confirm a number. Plan, side, front: the three views an
// aircraft three-view uses, for the same reason.
const key = new URL(location).searchParams.get('t') || 'regional-jet';
const p = TARGET_PRESETS[key];
const W = 1400, H = 1300;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(W, H); renderer.setClearColor(0xf2f4f7, 1);
renderer.setScissorTest(true);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa5b1, 2.0));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(2, 3, 2); scene.add(sun);
const g = aircraftGeometry(p.spanM, p.lengthM, { planform: p.planform, wing: p.wing,
  engines: p.engines, enginesOn: p.enginesOn });
const mat = new THREE.MeshStandardMaterial({ color: 0x2b3440, roughness: 0.55, metalness: 0.05 });
g.traverse((m) => { if (m.isMesh) m.material = mat; });
scene.add(g);
const R = Math.max(p.spanM, p.lengthM) * 0.60;
const views = [
  { name: 'plan',  pos: [0, 100, 0],  up: [0, 0, -1], rect: [0, H / 2, W, H / 2] },
  { name: 'side',  pos: [100, 0, 0],  up: [0, 1, 0],  rect: [0, H / 4, W, H / 4] },
  { name: 'front', pos: [0, 0, 100],  up: [0, 1, 0],  rect: [0, 0, W / 2, H / 4] },
  { name: '3/4',   pos: [70, 34, 62], up: [0, 1, 0],  rect: [W / 2, 0, W / 2, H / 4] },
];
for (const v of views) {
  const [x, y, w, h] = v.rect;
  const a = w / h;
  const cam = new THREE.OrthographicCamera(-R * a, R * a, R, -R, 0.1, 500);
  cam.position.set(...v.pos); cam.up.set(...v.up); cam.lookAt(0, 0, 0);
  renderer.setViewport(x, y, w, h); renderer.setScissor(x, y, w, h);
  renderer.render(scene, cam);
}
window.__drawn = true;
</script></body></html>
